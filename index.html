<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="인생 역전을 꿈꾸는 초보 탐험가가 보물섬, 호박섬, 눈꽃섬, 모래섬을 탐험하는 2D 픽셀 RPG. 매의 눈과 만능 지도로 전설의 보물을 찾아라!">
<meta property="og:type" content="website">
<meta property="og:title" content="인생역전 탐험기">
<meta property="og:description" content="탐험만 잘하면 돈도 벌고 유명해진다고? 쌉가능! 네 섬을 돌며 황금 나침반을 완성하는 픽셀 RPG">
<meta property="og:image" content="https://hoonchoi0324-hihi.github.io/life-flip-explorer/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://hoonchoi0324-hihi.github.io/life-flip-explorer/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hoonchoi0324-hihi.github.io/life-flip-explorer/og-image.png">
<title>인생역전 탐험기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Silkscreen&display=swap">
<style>
/* layout: full-bleed pixel canvas, HUD floats in corners, parchment dialogue at bottom */
:root{
  --ink:#141526;--ink-2:#20223a;--ink-3:#2f3252;
  --parch:#f1e4c3;--parch-2:#dcc794;--brown:#3b2614;--edge:#8a5a24;
  --gold:#f5c542;--rust:#c4532f;--rust-2:#8f3518;--muted:#a9a6c4;
  --f-disp:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,sans-serif;
  --f-px:"Silkscreen",ui-monospace,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--ink);color:var(--parch);font-family:var(--f-body);overflow:hidden}
#stage{position:relative;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:12px;left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:calc(100% - 150px)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:rgba(20,21,38,.82);border:2px solid var(--ink-3);padding:3px 8px;border-radius:3px;font-family:var(--f-px);font-size:13px;line-height:18px;color:var(--parch);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .k{font-family:var(--f-disp);font-size:13px;color:var(--muted)}
.pill .isl{font-family:var(--f-disp);font-size:14px;color:var(--gold)}
.pill img{width:16px;height:16px;image-rendering:pixelated}
#hearts{display:flex;flex-wrap:wrap;gap:2px;background:rgba(20,21,38,.82);border:2px solid var(--ink-3);padding:4px 6px;border-radius:3px;max-width:260px}
#hearts img{width:21px;height:21px;image-rendering:pixelated}
#frags img{opacity:.25}#frags img.on{opacity:1}
#eyePill.on{border-color:var(--gold);color:var(--gold)}
#mini{position:absolute;top:12px;right:max(14px,env(safe-area-inset-right,0px));width:144px;height:108px;image-rendering:pixelated;border:3px solid var(--edge);outline:2px solid var(--brown);background:var(--ink);cursor:pointer;border-radius:2px}
@media (max-width:520px){#mini{width:108px;height:81px}#hud{max-width:calc(100% - 140px)}.pill{font-size:12px}}
#toast{position:absolute;top:64px;left:50%;transform:translate(-50%,-8px);background:var(--gold);color:var(--brown);font-family:var(--f-disp);font-size:16px;padding:6px 14px;border:2px solid var(--brown);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(660px,calc(100% - 32px));box-sizing:border-box;background:var(--parch);color:var(--brown);border:3px solid var(--brown);box-shadow:inset 0 0 0 3px var(--parch-2),5px 5px 0 rgba(0,0,0,.45);padding:16px 20px 20px;font-family:var(--f-disp);font-size:19px;line-height:1.55;min-height:96px;cursor:pointer}
#dlg .who{position:absolute;top:-17px;left:16px;background:var(--rust);color:#fff1d6;font-size:15px;padding:1px 12px;border:2px solid var(--brown)}
#dlg .more{position:absolute;right:14px;bottom:6px;font-size:13px;color:var(--edge);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#touch{position:absolute;left:0;right:0;bottom:0;height:200px;pointer-events:none}
#pad{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(241,228,195,.1);border:2px solid rgba(241,228,195,.32);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:rgba(241,228,195,.5);border:2px solid var(--parch)}
#btns{position:absolute;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
#btns button{font-family:var(--f-disp);border:3px solid var(--brown);color:var(--brown);touch-action:none;box-shadow:0 4px 0 var(--brown)}
#bA{width:76px;height:76px;border-radius:50%;background:var(--rust);color:#fff1d6!important;font-size:24px}
#bE{width:60px;height:60px;border-radius:50%;background:var(--gold);font-size:14px;line-height:1.1;margin-bottom:28px}
#bP{width:52px;height:52px;border-radius:50%;background:#8fdc6a;font-size:14px;margin-bottom:62px}
#btns button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
#mapov,#shop{background:rgba(10,10,20,.74);align-items:flex-start}
.mapcard,.shopcard{margin:auto;background:var(--parch);color:var(--brown);border:3px solid var(--brown);box-shadow:inset 0 0 0 3px var(--parch-2),6px 6px 0 rgba(0,0,0,.5);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.mapcard{width:min(620px,100%)}.shopcard{width:min(560px,100%)}
.mh{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-disp);font-size:22px;gap:12px;flex-wrap:wrap}
.mh small{font-size:15px;color:var(--edge)}
#bigmap{width:100%;height:auto;image-rendering:pixelated;display:block;border:2px solid var(--edge);background:#1c1e33}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border:1px solid var(--brown);vertical-align:-1px}
.btn{font-family:var(--f-disp);font-size:18px;background:var(--rust);color:#fff1d6;border:3px solid var(--brown);padding:8px 22px;cursor:pointer;box-shadow:0 4px 0 var(--brown);align-self:flex-start}
.btn:hover{background:#d6633d}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
.btn.ghost{background:transparent;color:var(--parch);border-color:var(--ink-3);box-shadow:0 4px 0 var(--ink-3);font-size:15px;padding:6px 14px}
.btn.ghost:hover{background:var(--ink-2)}
button:focus-visible,#mini:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.quote{margin:0;font-family:var(--f-disp);font-size:16px;color:var(--edge)}
#shopList{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;background:#fff8e6;border:2px solid var(--parch-2);padding:8px 10px}
.item>div{min-width:0}
.item img{width:32px;height:32px;image-rendering:pixelated}
.item .nm{font-family:var(--f-disp);font-size:17px;line-height:1.3}
.item .no{display:inline-block;font-family:var(--f-px);font-size:11px;background:var(--brown);color:var(--parch);padding:0 5px;margin-right:6px;vertical-align:2px}
.item .ds{font-size:13px;color:#6b4a2a;line-height:1.4}
.lv{display:flex;gap:3px;margin-top:4px}.lv i{width:12px;height:6px;background:var(--parch-2);border:1px solid var(--edge)}.lv i.on{background:var(--rust)}
.buy{font-family:var(--f-px);font-size:13px;background:var(--gold);color:var(--brown);border:2px solid var(--brown);padding:6px 10px;cursor:pointer;min-width:76px;box-shadow:0 3px 0 var(--brown);font-variant-numeric:tabular-nums}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brown)}
.buy:disabled{background:#ddd3bb;color:#8b7a5e;box-shadow:none;cursor:default;font-family:var(--f-disp)}
#title,#end{background-color:var(--ink);background-image:linear-gradient(rgba(241,228,195,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(241,228,195,.05) 1px,transparent 1px);background-size:32px 32px}
.tbox{display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:860px;margin:auto}
.tl{display:flex;flex-direction:column;gap:14px;max-width:460px;min-width:0}
.eyebrow{margin:0;font-family:var(--f-disp);color:var(--muted);font-size:16px;letter-spacing:.06em}
h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(52px,11vw,84px);line-height:.95;color:var(--gold);text-shadow:5px 5px 0 var(--rust-2),10px 10px 0 rgba(0,0,0,.35);text-wrap:balance}
.tag{margin:0;font-family:var(--f-disp);font-size:20px;line-height:1.45;color:var(--parch)}
.route{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-family:var(--f-disp);font-size:15px;color:var(--muted)}
.route b{font-weight:400;color:var(--parch);border:2px solid var(--ink-3);padding:1px 8px}
.route b.done{border-color:var(--gold);color:var(--gold)}
.keys{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.test{font-size:14px;color:var(--muted)}
.test summary{cursor:pointer;font-family:var(--f-disp)}
.test .row{margin-top:10px;gap:8px}
.test select{font-family:var(--f-disp);font-size:15px;background:var(--ink-2);color:var(--parch);border:2px solid var(--ink-3);padding:5px 8px}
.hero{position:relative;width:168px;height:224px;flex:none}
.hero img{width:168px;height:224px;image-rendering:pixelated;animation:bob 1.2s steps(2) infinite}
.hero::after{content:"";position:absolute;left:24px;right:24px;bottom:-10px;height:12px;background:rgba(0,0,0,.35);border-radius:50%}
@keyframes bob{50%{transform:translateY(-6px)}}
.ebox{margin:auto;background:var(--parch);color:var(--brown);border:3px solid var(--brown);box-shadow:inset 0 0 0 3px var(--parch-2),8px 8px 0 rgba(0,0,0,.5);padding:24px;width:min(460px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
.ebox h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:34px;color:var(--rust-2);text-wrap:balance}
#estats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:16px}
#estats b{font-family:var(--f-px);font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
.credit{display:flex;align-items:center;gap:14px;background:#000;color:#fff;padding:14px 16px}
.credit svg{width:44px;height:38px;flex:none}
.credit span{font-family:var(--f-px);font-size:14px;letter-spacing:.04em}
#cut{align-items:flex-end;padding-bottom:calc(9vh + env(safe-area-inset-bottom,0px));cursor:pointer}
#cutTxt{margin:0;max-width:620px;text-align:center;font-family:var(--f-disp);font-size:clamp(18px,4.4vw,24px);line-height:1.55;color:#fff6e0;text-shadow:2px 2px 0 #2b2148,0 0 12px rgba(43,33,72,.85);opacity:0}
#cutTxt.in{animation:cutin .7s forwards}
@keyframes cutin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#cutTxt .sp{display:block;font-size:.75em;color:var(--gold)}
#cutTxt .cr{display:flex;flex-direction:column;align-items:center;gap:8px}
#cutTxt .cr svg{width:56px;height:48px;background:#000;padding:10px}
#cutTxt .big{font-size:1.6em;color:var(--gold)}
#cutTxt .px{font-family:var(--f-px);font-size:.7em}
@media (prefers-reduced-motion:reduce){.hero img,#dlg .more,#cutTxt.in{animation:none}#toast{transition:none}#cutTxt{opacity:1}}
</style>

</head>
<body>
<div id="stage" tabindex="-1">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="row"><div id="hearts"></div><div class="pill"><img id="icCoin" alt=""><span id="gold">0</span></div><div class="pill"><img id="icPot" alt=""><span id="pot">0</span></div><div class="pill"><img id="icWep" alt=""><span id="wlv">+0</span></div></div>
    <div class="row">
      <div class="pill"><span class="isl" id="islName">보물섬</span><img id="icCmp" alt=""><span id="cmp">0/4</span></div>
      <div class="pill" id="frags"><img alt=""><img alt=""><img alt=""></div>
      <div class="pill" id="eyePill"><img id="icEye" alt=""><span id="eyeTxt">준비</span></div>
      <div class="pill"><span class="k">지도</span><span id="exp">0%</span></div>
    </div>
  </div>
  <canvas id="mini" width="240" height="180" tabindex="0" aria-label="만능 지도 펼치기"></canvas>
  <div id="toast" role="status"></div>
  <div id="dlg" hidden><div class="who"></div><div class="txt"></div><div class="more">▼</div></div>
  <div id="touch" hidden>
    <div id="pad"><div id="knob"></div></div>
    <div id="btns"><button id="bP" aria-label="포션 마시기">포션</button><button id="bE" aria-label="매의 눈">매의<br>눈</button><button id="bA" aria-label="공격 또는 조사">A</button></div>
  </div>
  <div id="mapov" class="ov" hidden>
    <div class="mapcard">
      <div class="mh"><span id="mapTitle">만능 지도</span><small id="mapPct"></small></div>
      <canvas id="bigmap" width="480" height="360"></canvas>
      <div class="legend">
        <span><i style="background:#ff4d4d"></i>나</span>
        <span><i style="background:#f5c542"></i>보물 상자</span>
        <span><i style="background:#8a8a8a"></i>열어 본 상자</span>
        <span><i style="background:#b46ad9"></i>떠돌이 상인</span>
        <span><i style="background:#c7ab62"></i>신전</span>
      </div>
      <button class="btn" id="mapClose">지도 접기</button>
    </div>
  </div>
  <div id="shop" class="ov" hidden>
    <div class="shopcard">
      <div class="mh"><span>떠돌이 상인의 가게</span><small>보유 금화 <b id="shopGold">0</b></small></div>
      <p class="quote" id="shopQuote"></p>
      <div id="shopList"></div>
      <button class="btn" id="shopClose">가게 나가기</button>
    </div>
  </div>
  <div id="title" class="ov">
    <div class="tbox">
      <div class="tl">
        <p class="eyebrow">초보 탐험가의 네 섬 모험</p>
        <h1>인생역전<br>탐험기</h1>
        <p class="tag">탐험만 잘하면 돈도 벌고 유명해진다고?<br>쌉가능! 바로 해야쥐!</p>
        <div class="route" id="route"></div>
        <div class="row" style="gap:12px"><button class="btn" id="contBtn" hidden></button><button class="btn" id="startBtn">처음부터 탐험</button></div>
        <p class="keys" id="keysHint"></p>
        <details class="test"><summary>테스트 모드</summary>
          <div class="row"><select id="islSel" aria-label="테스트할 섬"><option value="0">보물섬</option><option value="1">호박섬</option><option value="2">눈꽃섬</option><option value="3">모래섬</option></select>
          <button class="btn ghost" id="tStart">이 섬부터</button><button class="btn ghost" id="tClear">섬 엔딩</button><button class="btn ghost" id="tTrue">진엔딩</button></div>
        </details>
      </div>
      <div class="hero"><img id="heroImg" alt="모자를 쓴 초보 탐험가"></div>
    </div>
  </div>
  <div id="cut" class="ov" hidden><p id="cutTxt"></p></div>
  <div id="end" class="ov" hidden>
    <div class="ebox">
      <h2 id="endTitle">섬 클리어!</h2>
      <div id="estats"></div>
      <div class="credit">
        <svg viewBox="0 0 90 78" aria-hidden="true"><circle cx="20" cy="18" r="18" fill="#fff"/><rect x="0" y="40" width="40" height="34" fill="#fff"/><polygon points="46,0 46,74 86,74" fill="#fff"/></svg>
        <span>Created by manamiwu</span>
      </div>
      <button class="btn" id="endBtn">다음 섬으로</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const TS=16,W=120,H=90,VR=5.5;
const T={WATER:0,SAND:1,GRASS:2,TREE:3,ROCK:4,PATH:5,BRIDGE:6,FLOOR:7,WALL:8,FLOWER:9,GATE:10,HOUSE:11,TFLOOR:12};
const SOLID=new Set([T.WATER,T.TREE,T.ROCK,T.WALL,T.GATE,T.HOUSE]);
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

/* ---------- islands ---------- */
const THEMES=[
 {name:'보물섬',grass:['#5b9e48','#4f8e3f','#68ad53','#3f7a33'],sand:['#e3cb8c','#d3b571','#efdcaa'],path:['#c69f64','#b08a52','#d6b37b'],water:['#2f6db0','#2a63a1','#3576bd','#6aa6e6'],
  tree:'round',tc:['#1f4d24','#2f6b2f','#3f8a3a','#5aa64a','#6b4423'],rock:['#4c4e58','#8d8f99','#b3b5be','#6a6c76'],flower:'flower',floor:['#8d8a7e','#6f6c62','#a19e91'],wall:['#56556a','#3e3d4e','#75748c'],
  tint:null,weather:null,sky:['#2b2148','#432a5c','#6c3262','#9c405c','#c95a54','#e8804f','#f5ad5c'],
  enemy:{slime:{},bat:{},golem:{},boss:{Q:'#cdb064',q:'#8a7230'}},foes:{slime:'슬라임',bat:'박쥐',golem:'돌 골렘'}},
 {name:'호박섬',grass:['#4d5a2c','#414d24','#5a6834','#33401c'],sand:['#c9a36a','#b48e58','#d8b47e'],path:['#8a6a4a','#76583c','#9c7a58'],water:['#3a2f6b','#30275c','#45397c','#8a72d6'],
  tree:'dead',tc:['#2a1e2e','#3d2b3f','#5a3f52','#7a5a6a','#3b2a1e'],rock:['#3a3542','#6a6278','#8f86a0','#4e4858'],flower:'pumpkin',floor:['#6e6474','#56505c','#857a8a'],wall:['#3f3548','#2b2433','#594c66'],

    const L=[{w:EXP,t:`드디어… ${TH().name}의 전설의 보물이다!!`},{w:'',t:`상자 안에는 금화 999개와 황금 나침반 조각이 들어 있었다. (나침반 ${compass}/4)`}];
    if(ti===0)L.push({w:'',t:'조각 뒷면에는 이렇게 적혀 있다. "진짜 보물은 네가 그린 그 지도다."'},{w:EXP,t:'에이 감동은 감동이고… 금화 999개면 인생 역전 쌉가능이지!'});
    else if(ti<3)L.push({w:EXP,t:'나침반 바늘이 또 다른 섬을 가리키고 있어!'});
    else L.push({w:EXP,t:'마지막 조각이다! 네 조각이 딸깍 하고 맞물렸다!'});
    if(ti<3){saveProgress(ti+1);say(L,()=>playCut('clear'))}else{clearSave();say(L,()=>playCut('true'))}}}
function tryGate(){if(frags<3){say([{w:'',t:'문에 지도 모양 홈이 세 개 파여 있다. 꿈쩍도 하지 않는다.'},{w:EXP,t:`지도 조각이 ${3-frags}개 모자라. 유적부터 뒤져 봐야쥐.`}]);return}
  gateOpen=true;for(const [x,y] of gateTiles){map[y*W+x]=T.TFLOOR;if(explored[y*W+x]){mb.fillStyle=MCOLS[ti][T.TFLOOR];mb.fillRect(x,y,1,1)}}
  shake=8;sfx(90,.6,'sawtooth',.07,-30);say([{w:'',t:'지도 조각을 홈에 끼우자 문이 쿠르르릉 열렸다!'},{w:EXP,t:'저 안에 전설의 보물이… 근데 뭔가 큰 게 움직이는데?'}])}

function updEnemy(e,dt){const P=player,dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;if(d>280)return;
  e.anim+=dt;e.hurt=Math.max(0,e.hurt-dt);e.rest=Math.max(0,e.rest-dt);
  if(e.kt>0){e.kt-=dt;if(e.kind==='bat'){e.x+=e.kx*dt;e.y+=e.ky*dt}else move(e,e.kx*dt,e.ky*dt,4,3);return}
  if(e.kind==='slime'){e.t-=dt;if(e.t<=0){if(d<100&&!(e.rest>0)){const sp=62+ti*6;e.vx=dx/d*sp;e.vy=dy/d*sp;e.t=.8+Math.random()*.5}else{const a=Math.random()*6.28;e.vx=Math.cos(a)*22;e.vy=Math.sin(a)*22;e.t=1.4+Math.random()}e.hop=.32}
    if(e.hop>0){e.hop-=dt;move(e,e.vx*dt,e.vy*dt,4,3)}}
  else if(e.kind==='bat'){if(e.rest>0){e.x-=dx/d*50*dt;e.y-=dy/d*50*dt}else if(d<120){const tx=dx/d,ty=dy/d,s=Math.sin(e.anim*5)*.9,sp=44+ti*4;e.x+=(tx*sp-ty*s*30)*dt;e.y+=(ty*sp+tx*s*30)*dt}else{e.x+=Math.cos(e.anim*1.3+e.seed)*18*dt;e.y+=Math.sin(e.anim*1.7+e.seed)*14*dt}
    e.x=clamp(e.x,8,W*TS-8);e.y=clamp(e.y,8,H*TS-8)}
  else{const boss=e.kind==='boss',hd=Math.hypot(e.hx-e.x,e.hy-e.y),sp=(boss?26:22)+ti*2;
    if(d<(boss?110:90)&&hd<(boss?70:100))move(e,dx/d*sp*dt,dy/d*sp*dt,5,3);else if(hd>3)move(e,(e.hx-e.x)/hd*18*dt,(e.hy-e.y)/hd*18*dt,5,3)}
  const rr=e.kind==='boss'?15:e.kind==='golem'?11:9;
  if(d<rr&&P.inv<=0&&!(e.rest>0)){const dmg=e.kind==='boss'?2+(ti>=2?1:0):(e.kind==='golem'&&ti===3?2:1);hurt(dmg,e.x,e.y);e.rest=2.5;e.kx=-dx/d*90;e.ky=-dy/d*90;e.kt=.25}}

const keys={};const joy={x:0,y:0};function clearKeys(){for(const k in keys)keys[k]=false}
function update(dt){const P=player;playTime+=dt;
  let ix=0,iy=0;if(keys.ArrowLeft||keys.KeyA)ix--;if(keys.ArrowRight||keys.KeyD)ix++;if(keys.ArrowUp||keys.KeyW)iy--;if(keys.ArrowDown||keys.KeyS)iy++;
  ix+=joy.x;iy+=joy.y;const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
  P.moving=m>.15;if(P.moving){if(Math.abs(ix)>Math.abs(iy))P.dir=ix<0?'left':'right';else P.dir=iy<0?'up':'down';P.walk+=dt}
  const sp=70*(P.atk>0?.55:1);let dx=ix*sp*dt,dy=iy*sp*dt;if(P.kt>0){P.kt-=dt;dx+=P.kx*dt;dy+=P.ky*dt}
  move(P,dx,dy);const tx=P.x/TS|0,ty=P.y/TS|0;if(tx!==P.tx||ty!==P.ty){P.tx=tx;P.ty=ty;reveal(tx,ty)}
  if(regenLv>0&&P.hp<P.max&&P.hp>0){regenT+=dt;if(regenT>=REGEN_INT[regenLv]){regenT=0;P.hp++;floatTxt(P.x,P.y-22,'+1 회복','#8fdc6a');sfx(880,.06,'triangle',.03)}}else regenT=0;
  P.inv-=dt;P.atk-=dt;P.cd-=dt;eyeT=Math.max(0,eyeT-dt);eyeCd=Math.max(0,eyeCd-dt);shake=Math.max(0,shake-dt*20);
  if(eyeT>0){for(const s of secrets)if(!s.found&&!s.taken&&Math.hypot(s.x-P.x,s.y-P.y)<112){s.found=true;burst(s.x,s.y-4,'#f5c542',5);sfx(1200,.05,'triangle',.03)}
    for(const t of traps)if(!t.found&&Math.hypot(t.x-P.x,t.y-P.y)<112)t.found=true}
  for(const c of coins)if(!c.taken&&Math.hypot(c.x-P.x,c.y-P.y)<11){c.taken=true;gold+=c.v;floatTxt(c.x,c.y-12,'+'+c.v,'#f5c542');coinSfx()}
  for(const s of secrets)if(s.found&&!s.taken&&Math.hypot(s.x-P.x,s.y-P.y)<12){s.taken=true;secretsFound++;gold+=s.v;floatTxt(s.x,s.y-14,`땅속 보물 +${s.v}`,'#f5c542');burst(s.x,s.y,'#f5c542',12);coinSfx()}
  for(const t of traps)if(!t.used&&Math.abs(t.x-P.x)<7&&Math.abs(t.y-P.y)<7&&P.inv<=0){t.found=true;t.used=true;hurt(1,t.x,t.y-6);floatTxt(P.x,P.y-26,TRAP_LINES[Math.random()*TRAP_LINES.length|0],'#ffb3a1')}
  for(const e of enemies)if(!e.dead)updEnemy(e,dt);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.t-=dt}parts=parts.filter(p=>p.t>0);
  for(const f of floats){f.y-=18*dt;f.t-=dt}floats=floats.filter(f=>f.t>0);
}

/* ---------- render ---------- */
function txt(s,x,y,col,size=8){ctx.font=`${size}px Jua, sans-serif`;ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=2.5;ctx.strokeStyle='#141526';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function render(){const c=ctx,P=player,TL=TILESETS[ti],F=FOES[ti];c.setTransform(1,0,0,1,0,0);c.fillStyle='#141526';c.fillRect(0,0,cv.width,cv.height);
  const S=scale*dpr;c.setTransform(S,0,0,S,0,0);c.imageSmoothingEnabled=false;
  let camX=Math.round(clamp(P.x-VW/2,0,W*TS-VW)),camY=Math.round(clamp(P.y-VH/2,0,H*TS-VH));
  if(shake>0&&!reduced){camX+=Math.round((Math.random()-.5)*shake);camY+=Math.round((Math.random()-.5)*shake)}
  const x0=Math.max(0,Math.floor(camX/TS)),y0=Math.max(0,Math.floor(camY/TS)),x1=Math.min(W-1,Math.floor((camX+VW)/TS)),y1=Math.min(H-1,Math.floor((camY+VH)/TS));
  const wf=(time*2|0)%2;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*W+x,t=map[i],set=TL[t][varr[i]%(t===T.GRASS?4:2)];c.drawImage((t===T.WATER||t===T.BRIDGE)?set[wf]:set[0],x*TS-camX,y*TS-camY)}
  for(const h of houses)c.drawImage(HOUSES_IMG[h.img],h.x*TS-camX,h.y*TS-camY);
  for(const t of traps)if(t.found&&!t.used)c.drawImage(SPIKE,Math.round(t.x-6-camX),Math.round(t.y-3-camY));
  for(const s of secrets)if(s.found&&!s.taken){const sx=Math.round(s.x-camX),sy=Math.round(s.y-camY);c.fillStyle='#e0484f';for(let k=-3;k<=3;k++){c.fillRect(sx+k,sy+k-1,1,1);c.fillRect(sx+k,sy-k-1,1,1)}
    if((time*3|0)%2){c.fillStyle='#fff3a8';c.fillRect(sx+4,sy-7,1,3);c.fillRect(sx+3,sy-6,3,1)}}
  const inView=(x,y)=>x>camX-32&&x<camX+VW+32&&y>camY-32&&y<camY+VH+40;
  const L=[];
  for(const co of coins)if(!co.taken&&inView(co.x,co.y))L.push({y:co.y,d:()=>{const b=Math.round(Math.sin(time*5+co.x)*1.5);c.drawImage(COIN,Math.round(co.x-4-camX),Math.round(co.y-8-camY+b))}});
  for(const ch of chests)if(inView(ch.x,ch.y))L.push({y:ch.y,d:()=>{const sx=Math.round(ch.x-camX),sy=Math.round(ch.y-camY);
    if(ch.legend){c.drawImage(ch.opened?LEG_O:LEG,sx-12,sy-16,24,18);if(!ch.opened&&(time*4|0)%2){c.fillStyle='#fff3a8';c.fillRect(sx-14,sy-18,1,1);c.fillRect(sx+13,sy-12,1,1)}}
    else c.drawImage(ch.opened?CHEST_O:CHEST,sx-6,sy-8)}});
  L.push({y:merchant.y,d:()=>{const sx=Math.round(merchant.x-camX),sy=Math.round(merchant.y-camY);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(sx-4,sy+2,8,2);c.drawImage(MERCH,sx-6,sy-13+((time*2|0)%2))}});
  for(const e of enemies)if(!e.dead&&inView(e.x,e.y))L.push({y:e.y,d:()=>drawEnemy(e,camX,camY,F)});
  L.push({y:P.y,d:()=>{const sx=Math.round(P.x-camX),sy=Math.round(P.y-camY);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(sx-4,sy+2,8,2);c.fillRect(sx-3,sy+1,6,4);
    if(P.inv>0&&(time*14|0)%2)return;const fr=P.moving?((P.walk*8|0)%2):0;c.drawImage(PS[P.dir][fr],sx-6,sy-13+(P.moving&&fr?-1:0))}});
  L.sort((a,b)=>a.y-b.y).forEach(o=>o.d());
  if(P.atk>0){const p=1-P.atk/.22,base={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[P.dir],a=base-1.1+p*2.2;
    for(let k=0;k<4;k++){const aa=a-k*.28,px=P.x+Math.cos(aa)*12-camX,py=P.y-5+Math.sin(aa)*12-camY;c.fillStyle=k===0?'#ffffff':`rgba(255,255,255,${.6-k*.15})`;c.fillRect(Math.round(px)-1,Math.round(py)-1,k===0?3:2,k===0?3:2)}}
  if(TH().tint){c.fillStyle=TH().tint;c.fillRect(0,0,VW,VH)}
  for(const p of parts){c.fillStyle=p.col;c.fillRect(Math.round(p.x-camX),Math.round(p.y-camY),2,2)}
  drawWeather();
  if(state==='play'&&!dlg){const it=interactables()[0];if(it){const b=Math.round(Math.sin(time*6)*1.5);const sx=it.x-camX,sy=it.y-camY+b;c.fillStyle='#f1e4c3';c.fillRect(sx-11,sy-9,22,11);c.fillStyle='#3b2614';c.fillRect(sx-11,sy+2,22,1);c.fillRect(sx-1,sy+2,2,2);
    c.font='8px Jua, sans-serif';c.textAlign='center';c.fillStyle='#3b2614';c.fillText(it.label,sx,sy)}}
  for(const f of floats){c.globalAlpha=Math.min(1,f.t*2);txt(f.s,f.x-camX,f.y-camY,f.col);c.globalAlpha=1}
  if(eyeT>0){const g=c.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.3,VW/2,VH/2,Math.max(VW,VH)*.75);g.addColorStop(0,'rgba(245,197,66,0)');g.addColorStop(1,'rgba(245,197,66,.3)');c.fillStyle=g;c.fillRect(0,0,VW,VH)}
  if(P.inv>.8){c.fillStyle=`rgba(224,72,79,${(P.inv-.8)*.4})`;c.fillRect(0,0,VW,VH)}
  drawMini();
}
function drawEnemy(e,camX,camY,F){const c=ctx,sx=Math.round(e.x-camX),sy=Math.round(e.y-camY),fr=(e.anim*4|0)%2;
  if(e.hurt>0&&(time*20|0)%2)return;
  let bx,by,bw,bh;c.fillStyle='rgba(0,0,0,.25)';
  if(e.kind==='slime'){c.fillRect(sx-5,sy+1,10,2);const hop=e.hop>0?-2:0;c.drawImage(F.slime[e.hop>0?0:fr],sx-6,sy-7+hop);bx=sx-7;by=sy-9;bw=14;bh=11}
  else if(e.kind==='bat'){c.fillRect(sx-3,sy+1,6,2);const b=Math.round(Math.sin(e.anim*6)*2);c.drawImage(F.bat[fr],sx-6,sy-16+b);bx=sx-7;by=sy-17+b;bw=14;bh=9}
  else if(e.kind==='golem'){c.fillRect(sx-6,sy+1,12,2);c.drawImage(F.golem,sx-7,sy-14+fr);bx=sx-8;by=sy-15;bw=16;bh=17}
  else{c.fillRect(sx-11,sy+1,22,3);c.drawImage(F.boss,sx-14,sy-27+fr,28,30);bx=sx-15;by=sy-28;bw=30;bh=31}
  if(eyeT>0||e.kind==='boss'||e.max>2&&e.hp<e.max){if(eyeT>0){c.fillStyle='#ff4d4d';const L=3;[[bx,by,1,1],[bx+bw,by,-1,1],[bx,by+bh,1,-1],[bx+bw,by+bh,-1,-1]].forEach(([x,y,a,b])=>{c.fillRect(x,y,a*L,1);c.fillRect(x,y,1,b*L)})}
    c.fillStyle='#141526';c.fillRect(bx,by-4,bw,3);c.fillStyle=e.kind==='boss'?'#f5c542':'#ff4d4d';c.fillRect(bx+1,by-3,Math.max(0,Math.round((bw-2)*e.hp/e.max)),1)}}
function drawMini(){mm.imageSmoothingEnabled=false;mm.clearRect(0,0,W*2,H*2);mm.drawImage(mbase,0,0,W*2,H*2);
  for(const ch of chests)if(explored[(ch.y/TS|0)*W+(ch.x/TS|0)]){mm.fillStyle=ch.opened?'#8a8a8a':'#f5c542';mm.fillRect((ch.x/TS|0)*2-1,(ch.y/TS|0)*2-1,4,4)}
  if((time*3|0)%2||state!=='play'){mm.fillStyle='#ff4d4d';mm.fillRect((player.x/TS)*2-2,(player.y/TS)*2-2,4,4)}}

function drink(){const P=player;if(state!=='play'||dlg)return;if(potions<=0){floatTxt(P.x,P.y-24,'포션이 없어! 상점에서 사자','#c9c9d4');return}if(P.hp>=P.max){floatTxt(P.x,P.y-24,'체력이 가득해','#c9c9d4');return}
  potions--;P.hp=Math.min(P.max,P.hp+2);floatTxt(P.x,P.y-24,'꿀꺽! +2','#8fdc6a');burst(P.x,P.y-8,'#8fdc6a',8);sfx(523,.08,'triangle',.05);setTimeout(()=>sfx(784,.1,'triangle',.05),80)}

const HEART_URL=HEART.toDataURL(),HEART_E_URL=HEART_E.toDataURL(),POTION_URL=POTION.toDataURL(),SHOVEL_URL=SHOVEL.toDataURL(),REGEN_URL=REGEN.toDataURL();

/* ---------- cutscenes ---------- */
const LOGO_SVG='<svg viewBox="0 0 90 78" aria-hidden="true"><circle cx="20" cy="18" r="18" fill="#fff"/><rect x="0" y="40" width="40" height="34" fill="#fff"/><polygon points="46,0 46,74 86,74" fill="#fff"/></svg>';
const SP=n=>`<span class="sp">${n}</span>`;
const CLEAR_LINES=[
  ['전설의 보물을 손에 넣은 초보 탐험가는 마을로 돌아왔다.','금화 999개 소식은 하루 만에 온 섬에 퍼졌다.','사람들은 이제 그를 초보 탐험가가 아니라<br>보물섬의 탐험가라고 부른다.',SP(EXP)+'근데 이 나침반 조각… 바늘이 바다 건너를 가리키네?',SP(EXP)+'인생 역전 2탄? 쌉가능! 바로 가야쥐!'],
  ['호박섬의 보물까지 손에 넣었다.','호박섬 사람들은 탐험가에게 호박 파이를 잔뜩 구워 주었다.',SP(EXP)+'호박 파이도 좋은데… 나침반 바늘이 또 움직이네?'],
  ['눈꽃섬의 보물도 찾아냈다.','얼음 속에 갇혀 있던 금화들이 햇빛을 받아 반짝였다.',SP(EXP)+'손은 꽁꽁 얼었지만 마음은 뜨겁다! 다음 섬으로!']];
const TRUE_LINES=['네 번째 조각을 끼우자 황금 나침반이 하나로 완성되었다.','나침반 바늘은 빙글빙글 돌더니…<br>처음 출발했던 보물섬 마을을 가리켰다.',
  SP(MER)+'기다리고 있었다. 사실 내가 옛날 그 전설의 탐험가야.',SP(MER)+'금화가 아무리 많아도 다음 섬이 궁금해서<br>또 떠나게 되더군. 이 나침반은 이제 네 거다.',
  SP(EXP)+'인생 역전은 금화가 아니라…<br>섬 네 개를 그린 이 지도들이었구나.',SP(EXP)+'…그래도 금화도 좋아! 쌉가능!','그날 이후 사람들은 그를 초보 탐험가가 아니라<br>전설의 탐험가라고 불렀다.'];
const CUT_STEP=3.8;let cutT=0,cutIdx=-1,cutCoins=[],cutKind='clear',cutLines=[],cutCredit='',fw=[];
function playCut(kind){state='cut';cutKind=kind;cutT=0;cutIdx=-1;cutCoins=[];fw=[];
  cutLines=kind==='true'?TRUE_LINES:CLEAR_LINES[ti];
  cutCredit=kind==='true'?`<span class="cr"><span class="big">진엔딩</span><span>인생역전 탐험기</span>${LOGO_SVG}<span class="px">Created by manamiwu</span><span>THE END</span></span>`
    :`<span class="cr"><span class="big">${TH().name} 클리어</span><span>황금 나침반 ${compass}/4</span><span>다음 섬: ${THEMES[ti+1].name}</span></span>`;
  $('#cut').hidden=false;$('#hud').hidden=true;mini.hidden=true;
  [523,659,784,1046,784,1046].forEach((f,i)=>setTimeout(()=>sfx(f,.18,'square',.05),i*160))}
function updCut(dt){cutT+=dt;const idx=Math.floor(cutT/CUT_STEP);
  if(idx!==cutIdx){cutIdx=idx;const el=$('#cutTxt');if(idx<cutLines.length)el.innerHTML=cutLines[idx];else if(idx<cutLines.length+2)el.innerHTML=cutCredit;else{finishCut();return}
    el.classList.remove('in');void el.offsetWidth;el.classList.add('in');if(idx===cutLines.length)coinSfx()}
  if(Math.random()<dt*10)cutCoins.push({x:Math.random()*VW,y:-10,vy:30+Math.random()*40});
  for(const k of cutCoins)k.y+=k.vy*dt;cutCoins=cutCoins.filter(k=>k.y<VH);
  if(cutKind==='true'&&Math.random()<dt*1.4){const x=VW*(.15+Math.random()*.7),y=VH*(.1+Math.random()*.3),col=['#f5c542','#ff7a6b','#8fdc6a','#9fd6ff','#f28ab2'][Math.random()*5|0];for(let i=0;i<22;i++){const a=i/22*6.28;fw.push({x,y,vx:Math.cos(a)*40,vy:Math.sin(a)*40,t:1.2,col})}if(cutT>1)sfx(200+Math.random()*200,.25,'triangle',.03,400)}
  for(const p of fw){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;p.t-=dt}fw=fw.filter(p=>p.t>0);
  updWeather(dt)}
function skipCut(){cutT=(Math.floor(cutT/CUT_STEP)+1)*CUT_STEP-.01;sfx(620,.03,'square',.03)}
function finishCut(){$('#cut').hidden=true;$('#hud').hidden=false;mini.hidden=false;showEnd(cutKind)}
$('#cut').addEventListener('click',skipCut);
function renderCut(){const c=ctx;c.setTransform(1,0,0,1,0,0);c.fillStyle='#2b2148';c.fillRect(0,0,cv.width,cv.height);const S=scale*dpr;c.setTransform(S,0,0,S,0,0);c.imageSmoothingEnabled=false;
  const tru=cutKind==='true',th=tru?THEMES[0]:TH(),TL=TILESETS[tru?0:ti];
  const gy=Math.round(VH*.66),bands=tru?['#241a48','#3a2a5c','#6a3a6e','#a8506a','#e07a5a','#f5a55a','#f7cf7a']:th.sky,bh=Math.ceil(gy/bands.length);
  bands.forEach((col,i)=>{c.fillStyle=col;c.fillRect(0,i*bh,VW,bh+1)});
  if(tru){c.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<30;i++){const x=(i*73)%VW,y=(i*37)%(gy*.5);if((time*2+i)%3>1)c.fillRect(x,y,1,1)}}
  c.fillStyle=ti===2&&!tru?'#ffffff':'#fff1b8';c.beginPath();c.arc(Math.round(VW*.74),gy-4,20,0,7);c.fill();
  c.fillStyle=th.water[0];c.fillRect(0,gy-6,VW,6);c.fillStyle='#f7cf7a';for(let x=(time*8|0)%12;x<VW;x+=12)c.fillRect(x,gy-4,5,1);
  for(let y=gy;y<VH;y+=16)for(let x=0;x<VW;x+=16)c.drawImage(TL[T.GRASS][(((x/16)|0)+(((y-gy)/16)|0))%4][0],x,y);
  const hx=Math.round(VW*.08);c.drawImage(HOUSES_IMG[0],hx,gy-24);c.drawImage(HOUSES_IMG[1],hx+34,gy-22);
  const cx=Math.round(VW*.5);
  if(tru){const grow=Math.min(1,cutT/10),rows=Math.round(2+grow*9);for(let r=0;r<rows;r++){const n=rows-r;for(let k=0;k<n;k++)c.drawImage(COIN,cx-n*4+k*8,gy-2-r*5)}
    const top=gy-2-(rows-1)*5,j=Math.round(Math.abs(Math.sin(cutT*3))*6);c.drawImage(PS.right[(cutT*4|0)%2],cx-20,gy-10-j);c.drawImage(MERCH,cx+12,gy-9);
    const cy=top-34+Math.round(Math.sin(cutT*2)*3);c.fillStyle='rgba(245,197,66,.25)';c.beginPath();c.arc(cx,cy+9,18+Math.sin(cutT*4)*2,0,7);c.fill();c.drawImage(COMPASS,cx-9,cy,18,18);
    for(const p of fw){c.globalAlpha=Math.min(1,p.t);c.fillStyle=p.col;c.fillRect(Math.round(p.x),Math.round(p.y),1,1)}c.globalAlpha=1}
  else{const grow=Math.min(1,cutT/7),rows=Math.round(2+grow*7);
    for(let r=0;r<rows;r++){const n=rows-r;for(let k=0;k<n;k++)c.drawImage(COIN,cx-n*4+k*8,gy-2-r*5)}
    const top=gy-2-(rows-1)*5,j=Math.round(Math.abs(Math.sin(cutT*3))*9);
    c.fillStyle='rgba(0,0,0,.25)';c.fillRect(cx-4,top+6,8,2);c.drawImage(PS.down[(cutT*6|0)%2],cx-6,top-10-j);
    c.drawImage(LEG_O,cx-58,gy-12,24,18);c.drawImage(MERCH,cx+36,gy-9-(Math.sin(cutT*5)>0?3:0))}
  for(const k of cutCoins)c.drawImage(COIN,Math.round(k.x),Math.round(k.y));
  if(!tru){if(th.tint){c.fillStyle=th.tint;c.fillRect(0,0,VW,VH)}drawWeather()}
  if((time*4|0)%2){c.fillStyle='#fff3a8';c.fillRect(cx-12,gy-40,1,3);c.fillRect(cx-13,gy-39,3,1);c.fillRect(cx+14,gy-30,1,3);c.fillRect(cx+13,gy-29,3,1)}}

/* ---------- flow ---------- */
let endKind='clear';
function showEnd(kind){state='end';endKind=kind;const fmt=s=>`${Math.floor(s/60)}분 ${String(Math.floor(s%60)).padStart(2,'0')}초`;
  const rows=kind==='true'?[['보유 금화',gold.toLocaleString()],['황금 나침반','4 / 4'],['무기',WNAMES[weaponLv]],['전체 쓰러뜨린 적',tKills],['전체 플레이 시간',fmt(tTime)]]
    :[['보유 금화',gold.toLocaleString()],['황금 나침반',compass+' / 4'],['이번 섬 탐험률',expPct()+'%'],['이번 섬 쓰러뜨린 적',kills],['찾은 땅속 보물',secretsFound+' / '+secrets.length],['걸린 시간',fmt(playTime)]];
  $('#estats').innerHTML=rows.map(([k,v])=>`<span>${k}</span><b>${v}</b>`).join('');
  $('#endTitle').textContent=kind==='true'?'진엔딩 달성! 전설의 탐험가':`${TH().name} 클리어!`;
  $('#endBtn').textContent=kind==='true'?'타이틀로':`다음 섬으로: ${THEMES[ti+1].name}`;
  $('#end').hidden=false;$('#endBtn').focus()}
function endNext(){$('#end').hidden=true;if(endKind==='true'){toTitle();return}ti++;startIsland()}
function startIsland(){prepIsland();state='play';['#title','#end','#cut','#shop','#mapov'].forEach(s=>$(s).hidden=true);$('#hud').hidden=false;mini.hidden=false;$('#stage').focus({preventScroll:true});
  toast(`${ti+1}번째 섬 · ${TH().name}`);say(introLines())}
function startFresh(i=0){initAudio();resetProgress();ti=i;compass=i;startIsland()}
function continueGame(){const s=loadSave();if(!s){startFresh(0);return}initAudio();resetProgress();gold=s.gold;weaponLv=s.weaponLv;hpLv=s.hpLv;regenLv=s.regenLv;potions=s.potions;compass=s.compass;tKills=s.tKills||0;tTime=s.tTime||0;ti=s.isl;startIsland()}
function toTitle(){state='title';player=null;['#end','#cut','#shop','#mapov'].forEach(s=>$(s).hidden=true);dlg=null;dlgEl.hidden=true;$('#title').hidden=false;refreshTitle();$('#startBtn').focus()}
function refreshTitle(){const s=loadSave(),done=s?s.isl:0;$('#route').innerHTML=THEMES.map((t,i)=>`<b class="${i<done?'done':''}">${t.name}</b>`).join('<span>→</span>')+'<span>→ 진엔딩</span>';
  const cb=$('#contBtn');if(s){cb.hidden=false;cb.textContent=`이어하기: ${THEMES[s.isl].name}`}else cb.hidden=true}
function testCut(kind){initAudio();resetProgress();ti=kind==='true'?3:+$('#islSel').value;if(kind==='clear'&&ti===3)ti=2;prepIsland();
  gold=1234;weaponLv=5;kills=42;tKills=168;secretsFound=17;playTime=754;tTime=3120;compass=kind==='true'?4:ti+1;
  for(let i=0;i<W*H;i++)if(!explored[i]){explored[i]=1;if(map[i]!==T.WATER)landExp++}
  $('#title').hidden=true;playCut(kind)}
$('#keysHint').textContent=isTouch?'왼쪽 패드로 이동 · A로 공격과 조사 · 매의 눈과 포션 버튼 · 오른쪽 위 지도를 누르면 크게 펼쳐져요':'이동 WASD 또는 방향키 · 공격과 조사 Space · 매의 눈 E · 포션 Q · 만능 지도 M';
$('#startBtn').addEventListener('click',()=>startFresh(0));$('#contBtn').addEventListener('click',continueGame);
$('#tStart').addEventListener('click',()=>startFresh(+$('#islSel').value));$('#tClear').addEventListener('click',()=>testCut('clear'));$('#tTrue').addEventListener('click',()=>testCut('true'));
$('#endBtn').addEventListener('click',endNext);
$('#mapClose').addEventListener('click',closeMap);
mini.addEventListener('click',()=>{initAudio();if(state==='map')closeMap();else openMap()});
mini.addEventListener('keydown',e=>{if(e.code==='Enter'){e.preventDefault();openMap()}});
dlgEl.addEventListener('click',()=>{if(dlg)advance()});
refreshTitle();

/* ---------- input ---------- */
const JAMO={'ㅂ':'KeyQ','ㅃ':'KeyQ','ㅈ':'KeyW','ㅉ':'KeyW','ㅁ':'KeyA','ㄴ':'KeyS','ㅇ':'KeyD','ㄷ':'KeyE','ㄸ':'KeyE','ㅡ':'KeyM','ㅓ':'KeyJ','ㅏ':'KeyK','ㅋ':'KeyZ','ㅌ':'KeyX'};
const KC={81:'KeyQ',49:'Digit1',50:'Digit2',51:'Digit3',52:'Digit4',53:'Digit5',87:'KeyW',65:'KeyA',83:'KeyS',68:'KeyD',69:'KeyE',77:'KeyM',74:'KeyJ',75:'KeyK',90:'KeyZ',88:'KeyX',32:'Space',13:'Enter',37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown',27:'Escape',9:'Tab'};
function codeOf(e){if(JAMO[e.key])return JAMO[e.key];if(e.code&&e.code!=='Unidentified')return e.code;return KC[e.keyCode]||''}
addEventListener('keydown',ev=>{const code=codeOf(ev);const e={code,repeat:ev.repeat};
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(code)||JAMO[ev.key]||ev.keyCode===229){if(state!=='title'||code==='Space')ev.preventDefault()}
  initAudio();keys[e.code]=true;if(e.repeat)return;
  if(state==='title'){if(e.code==='Enter'&&document.activeElement&&document.activeElement.tagName==='SELECT')return;if(e.code==='Space'){($('#contBtn').hidden?$('#startBtn'):$('#contBtn')).click()}return}
  if(state==='cut'){if(['Space','Enter','KeyJ','KeyZ'].includes(e.code))skipCut();return}
  if(state==='end'){if(e.code==='Space')endNext();return}
  if(state==='shop'){const m={Digit1:0,Digit2:1,Digit3:2,Digit4:3,Digit5:4}[e.code];if(m!==undefined)buyIdx(m);else if(['Escape','KeyM','Tab','KeyJ','KeyZ','Space'].includes(e.code))closeShop();return}
  if(state==='map'){if(['KeyM','Escape','Tab','Space','Enter'].includes(e.code))closeMap();return}
  if(['Space','Enter','KeyJ','KeyZ'].includes(e.code))action();
  else if(['KeyE','KeyK','KeyX'].includes(e.code))eye();
  else if(e.code==='KeyQ')drink();
  else if(e.code==='KeyM'||e.code==='Tab')openMap()});
addEventListener('keyup',e=>{keys[codeOf(e)]=false;keys[e.code]=false});
addEventListener('blur',clearKeys);
const stageEl=$('#stage');stageEl.addEventListener('pointerdown',()=>{if(document.activeElement!==stageEl&&state==='play')stageEl.focus({preventScroll:true})});

const pad=$('#pad'),knob=$('#knob');let joyId=null;
function joyMove(e){const r=pad.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}joy.x=Math.abs(x)<.2?0:x;joy.y=Math.abs(y)<.2?0:y;knob.style.transform=`translate(${x*36}px,${y*36}px)`}
pad.addEventListener('pointerdown',e=>{initAudio();joyId=e.pointerId;pad.setPointerCapture(e.pointerId);joyMove(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
const endJoy=e=>{if(e.pointerId===joyId){joyId=null;joy.x=joy.y=0;knob.style.transform=''}};
pad.addEventListener('pointerup',endJoy);pad.addEventListener('pointercancel',endJoy);
$('#bA').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();action()});
$('#bE').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();eye()});
$('#bP').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();drink()});

function resize(){const r=$('#stage').getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);
  scale=Math.max(2,Math.round(Math.min(r.width,r.height*1.4)/270));cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);VW=r.width/scale;VH=r.height/scale;wx=[]}
addEventListener('resize',resize);resize();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);try{step(now)}catch(err){console.error(err)}}
function step(now){const dt=clamp((now-last)/1000,0,.05);last=now;time+=dt;
  if(state==='play'&&!dlg)update(dt);if(dlg)updDlg(dt);
  if(state==='cut'){updCut(dt);renderCut()}else if(player){if(state==='play'||state==='map'||state==='shop')updWeather(state==='play'&&!dlg?dt:0);render()}
  updHud()}
if(location.hash==='#ending')setTimeout(()=>testCut('clear'),300);
if(location.hash==='#true')setTimeout(()=>testCut('true'),300);
requestAnimationFrame(loop);
</script>
